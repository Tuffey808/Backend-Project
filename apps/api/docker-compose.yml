services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gmall
      POSTGRES_PASSWORD: gmall
      POSTGRES_DB: gmall_portal
    ports:
      - "5434:5432"
    volumes:
      - gmall_portal_pg:/var/lib/postgresql/data

volumes:
  gmall_portal_pg:
