# Reverse proxy template — place TLS certs and enable on your VPS.
# Replace api.gmall.sa / portal.gmall.sa with your domains.
#
# With Certbot:
#   certbot certonly --nginx -d api.gmall.sa -d portal.gmall.sa

upstream gmall_api {
  server 127.0.0.1:3001;
}

upstream gmall_portal {
  server 127.0.0.1:3002;
}

server {
  listen 443 ssl http2;
  server_name api.gmall.sa;

  ssl_certificate     /etc/letsencrypt/live/api.gmall.sa/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.gmall.sa/privkey.pem;

  client_max_body_size 10M;

  location / {
    proxy_pass http://gmall_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# Same Let's Encrypt SAN cert as api (certbot -d api -d portal stores under first domain)
server {
  listen 443 ssl http2;
  server_name portal.gmall.sa gmall.sa;

  ssl_certificate     /etc/letsencrypt/live/api.gmall.sa/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.gmall.sa/privkey.pem;

  location / {
    proxy_pass http://gmall_portal;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 80;
  server_name api.gmall.sa portal.gmall.sa gmall.sa;
  return 301 https://$host$request_uri;
}
